---
# Adds a user to the "TEAM SAP Executable" team in Ansible Automation Platform / AWX,
# and grants that team the organization-level Execute role on "SAP Development" so it can
# run every job template in that organization, including ones created later.
# Also grants the team Read on each inventory listed in sap_inventories.
#
# Usage:
#   ansible-playbook add_user_to_team.yml -e "username=jdoe"
#   ansible-playbook add_user_to_team.yml -e '{"username": "jdoe", "sap_inventories": ["SAP Prod", "SAP QA"]}'
#
# Controller connection is read from environment variables:
#   CONTROLLER_HOST, CONTROLLER_USERNAME, CONTROLLER_PASSWORD (or CONTROLLER_OAUTH_TOKEN)
#   CONTROLLER_VERIFY_SSL=false   # optional, for self-signed certs
#
# Requires: ansible-galaxy collection install ansible.controller   (or awx.awx)

- name: Add user to TEAM SAP Executable
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    team_name: "TEAM SAP Executable"
    organization: "SAP Executable"
    job_template_organization: "SAP Development"
    # Inventory names to grant Read on; override with -e
    sap_inventories: []

  tasks:
    - name: Ensure username was provided
      ansible.builtin.assert:
        that:
          - username is defined
          - username | length > 0
        fail_msg: "Pass the user with -e username=<name>"

    - name: Look up {{ team_name }} in organization {{ organization }}
      ansible.builtin.set_fact:
        team: >-
          {{ lookup('ansible.controller.controller_api', 'teams',
                    query_params={'name': team_name, 'organization__name': organization},
                    expect_one=True) }}

    - name: Add {{ username }} as a member of {{ team_name }}
      ansible.controller.role:
        user: "{{ username }}"
        target_team: "{{ team.id }}"
        role: member
        state: present

    - name: Allow {{ team_name }} to execute all job templates in {{ job_template_organization }}
      ansible.controller.role:
        team: "{{ team.id }}"
        organization: "{{ job_template_organization }}"
        role: execute
        state: present

    - name: Grant {{ team_name }} Read on inventories in sap_inventories
      ansible.controller.role:
        team: "{{ team.id }}"
        inventories: "{{ sap_inventories }}"
        role: read
        state: present
      when: sap_inventories | length > 0
