---
# Creates the base SAP objects in Ansible Automation Platform / AWX:
#   Organization:  SAP
#   Teams:         SAP Development, SAP Executable
#   Project:       sap  (git: https://github.com/TheLawGit/SAP-onboard.git)
#   Inventories:   SAP NonProd, SAP PROD
#   Users:         sap-test-1, sap-test-2  (added as members of the SAP organization)
#   Job template:  SAP Onboarding  (runs add_user_to_team.yml from the sap project)
#
# Usage:
#   ansible-playbook setup_sap_controller.yml
#   ansible-playbook setup_sap_controller.yml -e "sap_controller_credential=<credential name>"
#
# Controller connection is read from environment variables:
#   CONTROLLER_HOST, CONTROLLER_USERNAME, CONTROLLER_PASSWORD (or CONTROLLER_OAUTH_TOKEN)
#   CONTROLLER_VERIFY_SSL=false   # optional, for self-signed certs
#
# Requires: ansible-galaxy collection install ansible.controller   (or awx.awx)

- name: Set up SAP organization on the automation controller
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    sap_organization: "SAP"
    sap_teams:
      - "SAP Development"
      - "SAP Executable"
    sap_project:
      name: "sap"
      scm_url: "https://github.com/TheLawGit/SAP-onboard.git"
      scm_branch: "main"
    sap_inventories_to_create:
      - "SAP NonProd"
      - "SAP PROD"
    sap_users:
      - "sap-test-1"
      - "sap-test-2"
    sap_user_password: "Ansible123!"
    sap_job_template:
      name: "SAP Onboarding"
      playbook: "add_user_to_team.yml"
      inventory: "SAP NonProd"
    # Name of an existing "Red Hat Ansible Automation Platform" credential that gives the
    # SAP Onboarding job access to the controller API; leave empty to attach none.
    sap_controller_credential: ""

  tasks:
    - name: Create organization {{ sap_organization }}
      ansible.controller.organization:
        name: "{{ sap_organization }}"
        state: present

    - name: Create teams in {{ sap_organization }}
      ansible.controller.team:
        name: "{{ item }}"
        organization: "{{ sap_organization }}"
        state: present
      loop: "{{ sap_teams }}"

    - name: Create project {{ sap_project.name }}
      ansible.controller.project:
        name: "{{ sap_project.name }}"
        organization: "{{ sap_organization }}"
        scm_type: git
        scm_url: "{{ sap_project.scm_url }}"
        scm_branch: "{{ sap_project.scm_branch }}"
        scm_update_on_launch: true
        state: present

    - name: Create inventories in {{ sap_organization }}
      ansible.controller.inventory:
        name: "{{ item }}"
        organization: "{{ sap_organization }}"
        state: present
      loop: "{{ sap_inventories_to_create }}"

    - name: Create users
      ansible.controller.user:
        username: "{{ item }}"
        password: "{{ sap_user_password }}"
        update_secrets: false
        state: present
      loop: "{{ sap_users }}"
      no_log: true

    - name: Add users as members of {{ sap_organization }}
      ansible.controller.role:
        user: "{{ item }}"
        organization: "{{ sap_organization }}"
        role: member
        state: present
      loop: "{{ sap_users }}"

    - name: Create job template {{ sap_job_template.name }}
      ansible.controller.job_template:
        name: "{{ sap_job_template.name }}"
        organization: "{{ sap_organization }}"
        project: "{{ sap_project.name }}"
        playbook: "{{ sap_job_template.playbook }}"
        inventory: "{{ sap_job_template.inventory }}"
        credentials: "{{ [sap_controller_credential] if sap_controller_credential else omit }}"
        job_type: run
        state: present
